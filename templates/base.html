<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ecocycle{% endblock %} - Waste Management System</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <!-- Logo Placeholder -->
                <div class="logo">
                    <div class="logo-placeholder">
                        <span class="logo-text">🌱 ECOCYCLE</span>
                    </div>
                </div>
                
                <!-- Navigation Links -->
                <div class="nav-links" id="navLinks">
                    <a href="{{ url_for('index') }}" class="nav-link">Home</a>
                    <a href="{{ url_for('about') }}" class="nav-link">About</a>
                    {% if session.student_id %}
                    <a href="{{ url_for('waste_logs') }}" class="nav-link">Waste Logs</a>
                    <a href="{{ url_for('available_rewards') }}" class="nav-link">Rewards</a>
                    <a href="{{ url_for('rewards_dashboard') }}" class="nav-link">Dashboard</a>
                    <a href="{{ url_for('logout') }}" class="nav-link logout-btn">Logout</a>
                    {% endif %}
                </div>
                
                <!-- Mobile Menu Toggle -->
                <div class="menu-toggle" id="menuToggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Ecocycle - Turning Waste to Wealth</p>
        </div>
    </footer>
    
    <!-- Main JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
